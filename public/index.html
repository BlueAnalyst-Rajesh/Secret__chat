<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Chat - Premium</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 500px;
      height: 90vh;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      padding: 15px 20px;
      background: #111827;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .header h2 { margin: 0; font-size: 1.2rem; }
    .status-badge { font-size: 0.8rem; color: #10b981; font-weight: bold; }
    
    #setup-screen { padding: 30px 20px; display: flex; flex-direction: column; gap: 15px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      padding: 10px 16px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: var(--accent-hover); }

    #chat-screen { display: none; flex-direction: column; height: 100%; }
    .action-bar {
      padding: 10px;
      background: #1e293b;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #334155;
      overflow-x: auto;
    }
    #chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #0b0f19;
    }
    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      word-break: break-word;
    }
    .sent { background: #4f46e5; align-self: flex-end; border-bottom-right-radius: 2px; }
    .received { background: #334155; align-self: flex-start; border-bottom-left-radius: 2px; }
    
    .file-card {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.2);
      padding: 8px;
      border-radius: 6px;
    }
    .file-card a { color: #60a5fa; text-decoration: none; font-weight: bold; }
    
    .typing-indicator { font-size: 0.8rem; color: var(--text-muted); padding: 5px 15px; }

    .input-bar { padding: 12px; display: flex; gap: 8px; background: #111827; }
    
    /* Video Call Screen Overlay */
    #video-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .video-container { position: relative; width: 90%; max-width: 600px; height: 60vh; background: #000; border-radius: 12px; overflow: hidden; }
    #remote-video { width: 100%; height: 100%; object-fit: cover; }
    #local-video { position: absolute; bottom: 10px; right: 10px; width: 120px; height: 90px; border-radius: 8px; object-fit: cover; border: 2px solid #fff; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>🔒 Secret Chat</h2>
    <span id="status" class="status-badge">Offline</span>
  </div>

  <div id="setup-screen">
    <input type="text" id="room" placeholder="Enter Secret Room Name">
    <input type="password" id="key" placeholder="Enter Encryption Secret Key">
    <button onclick="joinRoom()">Join Chat</button>
  </div>

  <div id="chat-screen">
    <div class="action-bar">
      <button onclick="startCall(true)">📹 Video Call</button>
      <button onclick="startCall(false)">📞 Audio Call</button>
      <button onclick="document.getElementById('file-input').click()">📁 File/Image</button>
      <button id="rec-btn" onclick="toggleRecord()">🎤 Voice</button>
      <input type="file" id="file-input" style="display:none" onchange="sendFile(event)">
    </div>

    <div id="chat-box"></div>
    <div id="typing-status" class="typing-indicator"></div>

    <div class="input-bar">
      <input type="text" id="message" placeholder="Type a message..." oninput="notifyTyping()">
      <button onclick="sendText()">Send</button>
    </div>
  </div>
</div>

<!-- Video Call View -->
<div id="video-modal">
  <div class="video-container">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay playsinline muted></video>
  </div>
  <button onclick="endCall()" style="background: #ef4444; margin-top: 20px; padding: 12px 24px;">End Call</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let roomId, secretKey, peerConnection, localStream;
  let isRecording = false, mediaRecorder, audioChunks = [];
  let typingTimeout;

  const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

  function xorEncrypt(text, key) {
    let result = '';
    for (let i = 0; i < text.length; i++) {
      result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    }
    return btoa(unescape(encodeURIComponent(result)));
  }

  function xorDecrypt(cipher, key) {
    try {
      let text = decodeURIComponent(escape(atob(cipher)));
      let result = '';
      for (let i = 0; i < text.length; i++) {
        result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
      }
      return result;
    } catch { return "⚠️ Decryption Error"; }
  }

  function joinRoom() {
    roomId = document.getElementById('room').value;
    secretKey = document.getElementById('key').value;
    if (!roomId || !secretKey) return alert("Please fill room and key!");
    socket.emit('join-room', roomId);
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('chat-screen').style.display = 'flex';
    document.getElementById('status').innerText = 'Connected';
  }

  function appendMsg(content, type, isHTML = false) {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    if (isHTML) div.innerHTML = content;
    else div.textContent = content;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function sendText() {
    const msgInput = document.getElementById('message');
    if (!msgInput.value) return;
    const encrypted = xorEncrypt(msgInput.value, secretKey);
    socket.emit('send-message', { roomId, data: encrypted, type: 'text' });
    appendMsg(msgInput.value, 'sent');
    msgInput.value = '';
  }

  function sendFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function() {
      const encrypted = xorEncrypt(reader.result, secretKey);
      socket.emit('send-message', { roomId, data: encrypted, type: 'file', fileName: file.name, fileType: file.type });
      renderFile(reader.result, file.name, file.type, 'sent');
    };
    reader.readAsDataURL(file);
  }

  function renderFile(dataUrl, name, fileType, sender) {
    if (fileType.startsWith('image/')) {
      appendMsg(`<img src="${dataUrl}" style="max-width:100%; border-radius:8px;">`, sender, true);
    } else {
      appendMsg(`<div class="file-card">📄 <span>${name}</span> <a href="${dataUrl}" download="${name}">Download</a></div>`, sender, true);
    }
  }

  async function toggleRecord() {
    const btn = document.getElementById('rec-btn');
    if (!isRecording) {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onload = () => {
          const encrypted = xorEncrypt(reader.result, secretKey);
          socket.emit('send-message', { roomId, data: encrypted, type: 'audio' });
          appendMsg(`<audio controls src="${reader.result}"></audio>`, 'sent', true);
        };
        reader.readAsDataURL(blob);
      };
      mediaRecorder.start();
      isRecording = true;
      btn.textContent = "🛑 Stop";
    } else {
      mediaRecorder.stop();
      isRecording = false;
      btn.textContent = "🎤 Voice";
    }
  }

  function notifyTyping() {
    socket.emit('typing', { roomId, isTyping: true });
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
      socket.emit('typing', { roomId, isTyping: false });
    }, 2000);
  }

  socket.on('user-typing', ({ isTyping }) => {
    document.getElementById('typing-status').innerText = isTyping ? 'Partner is typing...' : '';
  });

  socket.on('receive-message', ({ data, type, fileName, fileType }) => {
    const decrypted = xorDecrypt(data, secretKey);
    if (type === 'text') appendMsg(decrypted, 'received');
    else if (type === 'file') renderFile(decrypted, fileName, fileType, 'received');
    else if (type === 'audio') appendMsg(`<audio controls src="${decrypted}"></audio>`, 'received', true);
  });

  // --- WebRTC Audio / Video Call ---
  async function startCall(isVideo) {
    document.getElementById('video-modal').style.display = 'flex';
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo });
    document.getElementById('local-video').srcObject = localStream;

    peerConnection = new RTCPeerConnection(rtcConfig);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.onicecandidate = e => {
      if (e.candidate) socket.emit('ice-candidate', { roomId, candidate: e.candidate });
    };

    peerConnection.ontrack = e => {
      document.getElementById('remote-video').srcObject = e.streams[0];
    };

    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    socket.emit('call-user', { roomId, signal: offer, isVideo });
  }

  socket.on('call-made', async ({ signal, isVideo }) => {
    if (confirm(`Incoming ${isVideo ? 'Video' : 'Audio'} Call. Accept?`)) {
      document.getElementById('video-modal').style.display = 'flex';
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo });
      document.getElementById('local-video').srcObject = localStream;

      peerConnection = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      peerConnection.onicecandidate = e => {
        if (e.candidate) socket.emit('ice-candidate', { roomId, candidate: e.candidate });
      };

      peerConnection.ontrack = e => {
        document.getElementById('remote-video').srcObject = e.streams[0];
      };

      await peerConnection.setRemoteDescription(new RTCSessionDescription(signal));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      socket.emit('make-answer', { roomId, signal: answer });
    }
  });

  socket.on('answer-made', async ({ signal }) => {
    await peerConnection.setRemoteDescription(new RTCSessionDescription(signal));
  });

  socket.on('ice-candidate', async candidate => {
    if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
  });

  function endCall() {
    socket.emit('end-call', roomId);
    closeCall();
  }

  socket.on('call-ended', closeCall);

  function closeCall() {
    if (peerConnection) peerConnection.close();
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    document.getElementById('video-modal').style.display = 'none';
  }
</script>
</body>
</html>
